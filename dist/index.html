<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102c3a">
<title>Давление по этажам</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#143640;background:#102c3a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,#315d61 0,transparent 38%),linear-gradient(150deg,#102c3a,#14333d 58%,#0a2533)}main{max-width:1000px;margin:auto;padding:28px 24px 48px}.card{background:#f5f8f3;border-radius:26px;padding:30px;box-shadow:0 20px 60px #061b2740}.label{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:#577879;font-weight:700}h1{font-size:clamp(27px,4vw,38px);letter-spacing:-.035em;margin:8px 0}p{line-height:1.55;color:#5b7379}.intro{max-width:720px;margin:0}.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0 14px}label{display:block;font-size:14px;font-weight:650;margin-bottom:9px}input{width:100%;border-radius:12px;font:inherit;padding:13px;background:#fff;border:1px solid #adc3bc;color:#143640}input:focus,button:focus-visible{outline:3px solid #b5df63;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:10px}.button{border:0;border-radius:14px;background:#d6f48d;color:#183838;font:inherit;font-weight:750;padding:15px 20px;cursor:pointer;min-height:52px}.button:hover{background:#e2ffa5}.secondary{background:#e4ece8}.status{font-size:13px;min-height:20px;margin:12px 0 0}.table-wrap{overflow-x:auto;margin-top:22px;border:1px solid #d2dfd9;border-radius:16px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:13px 16px;border-bottom:1px solid #dce7e1}tr:last-child td{border-bottom:0}thead{background:#e8f0ea}th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#426461}tbody tr:nth-child(even){background:#f0f5f0}.reference-row{background:#e2f1c9!important;font-weight:750}@media(max-width:720px){main{padding:16px}.card{padding:22px}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:430px){.form-grid{grid-template-columns:1fr}th,td{padding:11px 9px}}
</style>
</head>
<body><main><section class="card" aria-labelledby="title"><div class="label">Таблица здания</div><h1 id="title">Давление по этажам</h1><p class="intro">Укажите высоту этажа и давление на известном этаже — сайт рассчитает значения для всего здания.</p>
<form id="form" novalidate><div class="form-grid">
<div><label for="step">Высота между этажами, м</label><input id="step" type="text" inputmode="decimal" required></div>
<div><label for="referenceFloor">Опорный этаж</label><input id="referenceFloor" type="number" inputmode="numeric" min="1" max="300" step="1" required></div>
<div><label for="referencePressure">Давление на нём, гПа</label><input id="referencePressure" type="text" inputmode="decimal" required></div>
<div><label for="count">Этажей в здании</label><input id="count" type="number" inputmode="numeric" min="1" max="300" step="1" required></div>
</div><div class="actions"><button class="button" type="submit">Построить таблицу</button><button class="button secondary" type="button" id="useNative" hidden>Взять давление с iPhone</button></div><p class="status" id="status" role="status" aria-live="polite"></p></form>
<div class="table-wrap"><table><thead><tr><th scope="col">Этаж</th><th scope="col">Высота от 1-го, м</th><th scope="col">Расчётное давление, гПа</th></tr></thead><tbody id="tableBody"></tbody></table></div>
</section></main>
<script>
const el=id=>document.getElementById(id);
const key='barrometr-pressure-v1';
const fmt=(n,d=1)=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d}).format(n);
const pressureFmt=n=>new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const number=v=>{const s=String(v).trim().replace(/\s/g,'').replace(',','.');return s&&/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN};
const validPressure=v=>Number.isFinite(v)&&v>=300&&v<=1100;
const valid=c=>Number.isFinite(c.step)&&c.step>=1&&c.step<=20&&Number.isInteger(c.referenceFloor)&&Number.isInteger(c.count)&&c.count>=1&&c.count<=300&&c.referenceFloor>=1&&c.referenceFloor<=c.count&&validPressure(c.referencePressure);
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(_){}
if(window.BarrometrNativeInitialState&&typeof window.BarrometrNativeInitialState==='object')saved=window.BarrometrNativeInitialState;
let config=valid(saved.tableConfig)?saved.tableConfig:{step:4.2,referenceFloor:2,referencePressure:1014.2,count:9};
let nativePressure=null,nativeTime=0;
const nativeReady=()=>validPressure(nativePressure)&&Date.now()-nativeTime<15000;
const scaleHeight=287.05*(20+273.15)/9.80665;
function render(){const body=el('tableBody');body.replaceChildren();for(let floor=1;floor<=config.count;floor++){const row=document.createElement('tr');if(floor===config.referenceFloor)row.className='reference-row';for(const value of [String(floor),fmt((floor-1)*config.step),pressureFmt(config.referencePressure*Math.exp(-(floor-config.referenceFloor)*config.step/scaleHeight))]){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}body.append(row)}el('useNative').hidden=!nativeReady()}
for(const [id,value] of [['step',config.step],['referenceFloor',config.referenceFloor],['referencePressure',config.referencePressure],['count',config.count]])el(id).value=typeof value==='number'&&!Number.isInteger(value)?fmt(value,2):String(value);
el('form').addEventListener('submit',event=>{event.preventDefault();const next={step:number(el('step').value),referenceFloor:Number(el('referenceFloor').value),referencePressure:number(el('referencePressure').value),count:Number(el('count').value),time:Date.now()};if(!valid(next)){el('status').textContent='Проверьте ввод: высота 1–20 м, давление 300–1100 гПа, этажность 1–300; опорный этаж должен быть в здании.';return}config=next;try{localStorage.setItem(key,JSON.stringify({...saved,tableConfig:config}))}catch(_){el('status').textContent='Таблица построена, но браузер не сохранил значения.';render();return}try{window.webkit?.messageHandlers?.barrometrStore?.postMessage(JSON.stringify({...saved,tableConfig:config}))}catch(_){}el('status').textContent='Таблица построена.';render()});
el('useNative').addEventListener('click',()=>{if(!nativeReady())return;el('referencePressure').value=fmt(nativePressure,2);el('form').requestSubmit()});
window.BarrometrNativeReceivePressure=(pressureHpa,timestampMs)=>{const value=Number(pressureHpa),time=Number(timestampMs);if(!validPressure(value)||!Number.isFinite(time)||Math.abs(Date.now()-time)>15000)return;nativePressure=value;nativeTime=time;render()};
window.BarrometrNativeSetError=()=>{nativePressure=null;nativeTime=0;render()};
render();setInterval(()=>{if(nativePressure)render()},5000);
</script></body></html>
